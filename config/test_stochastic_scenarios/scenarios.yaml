# This file is used to define the scenarios that are run by snakemake. Each entry on the first level is a scenario. Each scenario can contain configuration overrides with respect to the config/config.yaml settings.
#
# Example
#
# custom-scenario: # name of the scenario
#   electricity:
#       renewable_carriers: [wind, solar] # override the list of renewable carriers

agriculture_full_electric:
  structured_scenario: agriculture_full_electric

agriculture_machinery_full_oil:
  structured_scenario: agriculture_machinery_full_oil

shipping_full_methanol:
  structured_scenario: shipping_full_methanol

urban_heat_full_central:
  structured_scenario: urban_heat_full_central

land_transport_linear_ev:
  structured_scenario: land_transport_linear_ev

electricity_optimistic:
  structured_scenario: electricity_optimistic

industry_h2:
  structured_scenario: industry_h2
