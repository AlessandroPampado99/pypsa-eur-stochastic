# Simplified demand-transition scenario catalogue for deterministic runs.
# 2035-network cap update.
#
# Cap update criteria:
# - use the uploaded `__BASE__` column as the 2035 network;
# - use `BASE_2020` as the historical/current reference column present in the workbook;
# - where mappable, prevent delayed-transition scenarios from reducing low-carbon
#   source demands below the reference or increasing fossil target demands above it;
# - where the reference constraint is not informative, retain the 2050 practical cap
#   or the 20% structural/fallback cap already used for heat categories.

settings:
  units: TWh
  weighting: generators
  allow_unmet_target: false
  tolerance_twh: 1.0e-4
  non_negative_tolerance: 1.0e-8

families:
  ELEC:
    targets:
      conservative: 400

    entries:
      building_heat:
        source: gas urban central heat
        target: electricity urban central heat
        cap: 0.990
        type: shift
        efficiency_factor: 1.0

      land_transport_oil:
        source: land transport oil
        target: land transport EV
        cap: 0.950
        type: shift
        efficiency_factor: 0.302145139124

      agriculture_machinery_oil:
        source: agriculture machinery oil
        target: agriculture machinery electric
        cap: 0.950
        type: shift
        efficiency_factor: 2.333333333333

      solid_biomass_for_industry:
        source: solid biomass for industry
        target: industry electricity
        cap: 0.301
        type: shift
        efficiency_factor: 1.0

      low_temperature_heat_for_industry:
        source: low-temperature heat for industry
        target: industry electricity
        cap: 0.950
        type: shift
        cop:
          low-temperature heat for industry: urban central air heat pump

  OILGAS:
    targets:
      conservative: 200

    entries:
      building_heat:
        source: electricity urban central heat
        target: gas urban central heat
        cap: 0.990
        type: shift
        efficiency_factor: 1.0

      land_transport_EV:
        source: land transport EV
        target: land transport oil
        cap: 0.885
        type: shift
        efficiency_factor: 3.309644857175

      industry_electricity:
        source: industry electricity
        target: gas for industry
        cap: 0.212
        type: shift
        cop_mode: inverse
        cop:
          industry electricity: urban central air heat pump

      low_temperature_heat_for_industry:
        source: low-temperature heat for industry
        target: gas for industry
        cap: 0.950
        type: shift
        efficiency_factor: 1.0

      shipping_methanol:
        source:
          carrier: shipping methanol
        target: shipping oil
        cap: 0.950
        type: shift
        efficiency_factor: 1.15

      agriculture_machinery_electric:
        source: agriculture machinery electric
        target: agriculture machinery oil
        cap: 0.950
        type: shift
        efficiency_factor: 0.428571428571

  MEOH:
    targets:
      conservative: 250

    entries:
      aviation_kerosene:
        source: kerosene for aviation
        target: methanol kerosene for aviation
        cap: 0.950
        type: shift
        efficiency_factor: 1.0

      low_temperature_heat_for_industry:
        source: low-temperature heat for industry
        target: industry methanol
        cap: 0.950
        type: shift
        efficiency_factor: 1.0

      industry_electricity:
        source: industry electricity
        target: industry methanol
        cap: 0.212
        type: shift
        cop_mode: inverse
        cop:
          industry electricity: urban central air heat pump

      shipping_oil:
        source: shipping oil
        target:
          carrier: shipping methanol
        cap: 0.950
        type: shift
        efficiency_factor: 0.869565217391

      shipping_h2:
        source: H2 for shipping
        target:
          carrier: shipping methanol
        cap: 0.950
        type: shift
        efficiency_factor: 1.0

  H2:
    targets:
      conservative: 50
      high: 80

    entries:
      low_temperature_heat_for_industry:
        source:
          - low-temperature heat for industry
        target: H2 for industry
        cap: 0.950
        type: shift
        efficiency_factor: 1.0

      industry_electricity:
        source:
          - industry electricity
        target: H2 for industry
        cap: 0.212
        type: shift
        cop_mode: inverse
        cop:
          industry electricity: urban central air heat pump

      shipping_oil:
        source: shipping oil
        target: H2 for shipping
        cap: 0.950
        type: shift
        efficiency_factor: 1.0

      land_transport_oil:
        source: land transport oil
        target: land transport fuel cell
        cap: 0.950
        type: shift
        efficiency_factor: 0.535651226544

scenario_definitions:
  BASE: base

  ELEC_HEAT:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - building_heat
        - low_temperature_heat_for_industry
        - land_transport_oil
        - solid_biomass_for_industry

  ELEC_ROAD:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - land_transport_oil
        - agriculture_machinery_oil
        - building_heat
        - solid_biomass_for_industry

  ELEC_IND:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - low_temperature_heat_for_industry
        - solid_biomass_for_industry
        - land_transport_oil
        - building_heat


  OILGAS_TRANS:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - shipping_methanol
        - land_transport_EV
        - agriculture_machinery_electric
        - low_temperature_heat_for_industry

  OILGAS_IND:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - industry_electricity
        - low_temperature_heat_for_industry
        - land_transport_EV
        - building_heat

  OILGAS_HEAT:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - building_heat
        - low_temperature_heat_for_industry
        - land_transport_EV
        - agriculture_machinery_electric

  MEOH_AIR:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - aviation_kerosene
        - shipping_oil
        - industry_electricity
        - low_temperature_heat_for_industry

  MEOH_IND:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - industry_electricity
        - low_temperature_heat_for_industry
        - aviation_kerosene
        - shipping_oil

  MEOH_SHIP:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - shipping_oil
        - shipping_h2
        - industry_electricity
        - low_temperature_heat_for_industry
        - aviation_kerosene

  H2_IND:
    demand_transition:
      family: H2
      target: conservative
      priority:
        - industry_electricity
        - low_temperature_heat_for_industry

  H2_TRANS:
    demand_transition:
      family: H2
      target: conservative
      priority:
        - land_transport_oil
        - shipping_oil
        - industry_electricity
        - low_temperature_heat_for_industry

  H2_HIGH:
    demand_transition:
      family: H2
      target: high
      priority:
        - industry_electricity
        - low_temperature_heat_for_industry
        - shipping_oil
        - land_transport_oil
