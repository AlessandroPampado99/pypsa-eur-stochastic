# Simplified demand-transition scenario catalogue for deterministic runs.
# 2035-network cap update.
#
# Cap update criteria:
# - use the uploaded `__BASE__` column as the 2035 network;
# - use `BASE_2020` as the historical/current reference column present in the workbook;
# - where mappable, prevent delayed-transition scenarios from reducing low-carbon
#   source demands below the reference or increasing fossil target demands above it;
# - where the reference constraint is not informative, retain the 2050 practical cap
#   or the 20% structural/fallback cap already used for heat categories.

settings:
  units: TWh
  weighting: generators
  allow_unmet_target: false
  tolerance_twh: 1.0e-4
  non_negative_tolerance: 1.0e-8

families:
  ELEC:
    targets:
      conservative: 400

    entries:
      # Creati appositamente - posso shiftare tutto in quanto creati appositamente - efficienza 1 perché è domanda finale
      building_heat_central:
        source: gas urban central heat
        target: electricity urban central heat
        cap: 0.990
        type: shift
        efficiency_factor: 1.0

      building_heat_decentral:
        source: gas urban decentral heat
        target: electricity urban decentral heat
        cap: 0.990
        type: shift
        efficiency_factor: 1.0

      building_heat_rural:
        source: gas rural heat
        target: electricity rural heat
        cap: 0.990
        type: shift
        efficiency_factor: 1.0

      # Scambio di efficienza perché a parità di km ho bisogno di meno energia se uso motore elettrico
      # Non ho un link che mi fa il conto
      land_transport_oil:
        source: land transport oil
        target: land transport EV
        cap: 0.745
        type: shift
        efficiency_factor: 0.302145139124

      agriculture_machinery_oil:
        source: agriculture machinery oil
        target: agriculture machinery electric
        cap: 0.70 # valore al 2040
        type: shift
        efficiency_factor: 2.333333333333

      solid_biomass_for_industry:
        source: solid biomass for industry
        target: industry electricity
        cap: 0.301
        type: shift
        efficiency_factor: 1.0

      gas_for_industry:
        source: gas for industry
        target: industry electricity
        cap: 0.575
        type: shift
        efficiency_factor: 1.0

  OILGAS:
    targets:
      conservative: 400

    entries:
      building_heat_central:
        source: electricity urban central heat
        target: gas urban central heat
        cap: 0.990
        type: shift
        efficiency_factor: 1.0

      building_heat_decentral:
        source: electricity urban decentral heat
        target: gas urban decentral heat
        cap: 0.990
        type: shift
        efficiency_factor: 1.0

      building_heat_rural:
        source: electricity rural heat
        target: gas rural heat
        cap: 0.990
        type: shift
        efficiency_factor: 1.0

      land_transport_EV:
        source: land transport EV
        target: land transport oil
        cap: 0.885
        type: shift
        efficiency_factor: 3.309644857175

      industry_electricity:
        source: industry electricity
        target: gas for industry
        cap: 0.212
        type: shift
        efficiency_factor: 1.0

      solid_biomass_for_industry:
        source: solid biomass for industry
        target: gas for industry
        cap: 0.432
        type: shift
        efficiency_factor: 1.0

      shipping_methanol:
        source: shipping methanol
        target: shipping oil
        cap: 0.950 # shipping methanol era 0 al 2025
        type: shift
        efficiency_factor: 1.15

      agriculture_machinery_electric:
        source: agriculture machinery electric
        target: agriculture machinery oil
        cap: 0.950
        type: shift
        efficiency_factor: 0.428571428571

  MEOH:
    targets:
      conservative: 100 # non raggiungi nemmeno la parità in kerosene for aviation...

    entries:
      aviation_kerosene:
        source: kerosene for aviation
        target: methanol kerosene for aviation
        cap: 0.950
        type: shift
        efficiency_factor: 1.0

      naphta_for_industry:
        source: naphta for industry
        target: methanol for industry
        cap: 0.950
        type: shift
        efficiency_factor: 1.0

      shipping_oil:
        source: shipping oil
        target: shipping methanol
        cap: 0.653
        type: shift
        efficiency_factor: 0.869565217391

      shipping_h2:
        source: H2 for shipping
        target: shipping methanol
        cap: 0.950
        type: shift
        efficiency_factor: 1.0

  H2:
    targets:
      conservative: 100 # manco sufficiente a ciucciare tutto il metanolo...

    entries:
      gas_for_industry:
        source: gas for industry
        target: H2 for industry
        cap: 0.575
        type: shift
        efficiency_factor: 1.0

      industry_electricity:
        source: industry electricity
        target: H2 for industry
        cap: 0.212
        type: shift
        efficiency_factor: 1.0

      shipping_oil:
        source: shipping oil
        target: H2 for shipping
        cap: 0.653
        type: shift
        efficiency_factor: 1.0

      shipping_methanol:
        source: shipping methanol
        target: H2 for shipping
        cap: 0.950
        type: shift
        efficiency_factor: 1.0

      land_transport_oil:
        source: land transport oil
        target: land transport fuel cell
        cap: 0.745
        type: shift
        efficiency_factor: 0.535651226544

      oil_from_H2:
        source:
          - land transport oil
          - shipping oil
          - agriculture machinery oil
        target:
          name: EU oil from H2
        cap: 0.950
        type: shift
        efficiency_factor: 1.0

scenario_definitions:
  BASE: base

  ELEC_HEAT:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - building_heat_central
        - building_heat_decentral
        - building_heat_rural
        - land_transport_oil
        - agriculture_machinery_oil
        - gas_for_industry
        - solid_biomass_for_industry

  ELEC_ROAD:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - land_transport_oil
        - agriculture_machinery_oil
        - gas_for_industry
        - solid_biomass_for_industry
        - building_heat_central
        - building_heat_decentral
        - building_heat_rural


  ELEC_IND:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - gas_for_industry
        - solid_biomass_for_industry
        - building_heat_central
        - building_heat_decentral
        - building_heat_rural
        - land_transport_oil
        - agriculture_machinery_oil


  OILGAS_HEAT:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - building_heat_decentral
        - building_heat_central
        - building_heat_rural
        - shipping_methanol
        - land_transport_EV
        - agriculture_machinery_electric
        - industry_electricity
        - solid_biomass_for_industry

  OILGAS_TRANS:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - shipping_methanol
        - land_transport_EV
        - agriculture_machinery_electric
        - industry_electricity
        - solid_biomass_for_industry
        - building_heat_decentral
        - building_heat_central
        - building_heat_rural

  OILGAS_IND:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - industry_electricity
        - solid_biomass_for_industry
        - building_heat_decentral
        - building_heat_central
        - building_heat_rural
        - shipping_methanol
        - land_transport_EV
        - agriculture_machinery_electric


  MEOH_AIR:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - aviation_kerosene
        - shipping_oil
        - shipping_h2
        - naphta_for_industry

  MEOH_SHIP:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - shipping_oil
        - shipping_h2
        - naphta_for_industry
        - aviation_kerosene

  MEOH_IND:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - naphta_for_industry
        - aviation_kerosene
        - shipping_oil
        - shipping_h2

  H2_OIL:
    demand_transition:
      family: H2
      target: conservative
      priority:
        - oil_from_H2
        - shipping_methanol
        - shipping_oil
        - land_transport_oil
        - gas_for_industry
        - industry_electricity

  H2_TRANS:
    demand_transition:
      family: H2
      target: conservative
      priority:
        - shipping_methanol
        - shipping_oil
        - land_transport_oil
        - gas_for_industry
        - industry_electricity
        - oil_from_H2


  H2_IND:
    demand_transition:
      family: H2
      target: conservative
      priority:
        - gas_for_industry
        - industry_electricity
        - oil_from_H2
        - shipping_methanol
        - shipping_oil
        - land_transport_oil


