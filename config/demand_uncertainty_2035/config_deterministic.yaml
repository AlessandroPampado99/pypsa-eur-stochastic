# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#run
run:
  prefix: "demand_uncertainty_2035"
  name: all
  scenarios:
    enable: true
    file: config/demand_uncertainty_2035/scenarios/scenarios_deterministic.yaml
  disable_progressbar: false
  shared_resources:
    policy: false
    exclude: []
  use_shadow_directory: false

stochastic_scenarios:
  enable: false
  file: config/demand_uncertainty/scenarios/scenarios_determinstic_definition.yaml
  active_scenario:    # change this label to run one scenario at a time

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#scenario
scenario:
  clusters:
  - 'adm'
  opts:
  - ""
  sector_opts:
  - ""
  planning_horizons:
  - 2035

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#co2_budget
co2_budget:
  2020: 0.72
  2025: 0.648
  2030: 0.45
  2035: 0.30
  2040: 0.1
  2045: 0.05
  2050: 0.0

electricity:
  extendable_carriers:
    Generator:
    - solar
    - "solar-hsat"
    - onwind
    - "offwind-ac"
    - "offwind-dc"
    - "offwind-float"
    - OCGT
    - CCGT
    - nuclear
    StorageUnit: []
    Store:
    - battery
    - H2
    Link: []

biomass:
  year: 2035

costs:
  year: 2030

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#sector
sector:
  urban_central_heat_split:
    enable: true
    gas_share:
      2020: 0
      2025: 0
      2030: 0
      2035: 0.2
      2040: 0
      2045: 0
      2050: 0
    electricity_share:
      2020: 0
      2025: 0
      2030: 0
      2035: 0.2
      2040: 0
      2045: 0
      2050: 0
  land_transport_fuel_cell_share:
    2020: 0
    2025: 0
    2030: 0
    2035: 0.01
    2040: 0
    2045: 0
    2050: 0.05
  land_transport_electric_share:
    2020: 0
    2025: 0.05
    2030: 0.2
    2035: 0.44
    2040: 0.7
    2045: 0.85
    2050: 0.70
  land_transport_ice_share:
    2020: 1
    2025: 0.95
    2030: 0.8
    2035: 0.55
    2040: 0.3
    2045: 0.15
    2050: 0.25
  transport_electric_efficiency: 53.19
  transport_fuel_cell_efficiency: 30.003
  transport_ice_efficiency: 16.0712
  agriculture_machinery_electric_share: 0.5
  agriculture_machinery_oil_share: 0.5
  agriculture_machinery_fuel_efficiency: 0.7
  agriculture_machinery_electric_efficiency: 0.3
  shipping_hydrogen_liquefaction: true
  shipping_hydrogen_share:
    2020: 0
    2025: 0
    2030: 0
    2035: 0.01
    2040: 0
    2045: 0
    2050: 0.05
  shipping_methanol_share:
    2020: 0
    2025: 0
    2030: 0.15
    2035: 0.34
    2040: 0.55
    2045: 0.8
    2050: 0.8
  shipping_oil_share:
    2020: 1
    2025: 1
    2030: 0.85
    2035: 0.65
    2040: 0.45
    2045: 0.2
    2050: 0.15
  shipping_methanol_efficiency: 0.46
  shipping_oil_efficiency: 0.4
  aviation_demand_factor: 1.0
  aviation_methanol_to_kerosene: true
  aviation_methanol_kerosene_share:
    2020: 0.0
    2025: 0.0
    2030: 0.0
    2035: 0.2
    2040: 0.0
    2045: 0.0
    2050: 0.5
  methanol:
    regional_methanol_demand: true
    methanol_reforming: true
    methanol_reforming_cc: true
    methanol_to_kerosene: true
    methanol_to_power:
      ocgt: true
  H2_network: true
  gas_network: true
  H2_retrofit: false
  H2_retrofit_capacity_per_CH4: 0.6
  gas_network_connectivity_upgrade: 1
  gas_distribution_grid: true
  gas_distribution_grid_cost_factor: 1.0
  biomass_spatial: true
  biomass_transport: false
  biogas_upgrading: true
  biogas_upgrading_cc: false
  conventional_generation:
    OCGT: gas
    CCGT: gas
  biomass_to_liquid: true
  biomass_to_liquid_cc: false
  electrobiofuels: true


clustering:
  mode: administrative
  administrative:
    level: 0

  temporal: 
    resolution_sector: 3H

solving:
  load_shedding: true



