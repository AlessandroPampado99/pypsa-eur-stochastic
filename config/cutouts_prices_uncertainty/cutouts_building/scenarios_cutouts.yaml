# Scenarios for generating yearly ERA5 cutouts.
# Each scenario only overrides the default cutout name and the corresponding atlite cutout definition.

cutout-2000:
  atlite:
    default_cutout: "europe-2000-era5"
    cutouts:
      "europe-2000-era5":
        module: era5
        x: [-12.0, 42.0]
        y: [33.0, 72.0]
        dx: 0.3
        dy: 0.3
        time: ["2000", "2000"]
        chunks:
          time: 500
        prepare_kwargs:
          features:
          - temperature
          - height
          - runoff
          monthly_requests: true
          tmpdir: ./cutouts_tmp/

