# All 12 scenarios from scenarios.yaml, expressed using the current action catalogue.
# BASE receives the remaining probability.
scenarios:
  BASE: 0.988
  price_gas_3: 0.001
  price_gas_5: 0.001
  price_gas_8: 0.001
  price_oil_3: 0.001
  price_oil_5: 0.001
  price_oil_8: 0.001
  pmaxpu_solar_battery_0.8: 0.001
  pmaxpu_solar_battery_0.5: 0.001
  pmaxpu_solar_battery_0.2: 0.001
  pmaxpu_wind_0.8: 0.001
  pmaxpu_wind_0.5: 0.001
  pmaxpu_wind_0.2: 0.001
scenario_definitions:
  BASE:
    actions:
    - type: base
  price_gas_3:
    actions:
    - type: modify_components
      rules:
      - component: Generator
        attribute: marginal_cost
        target: auto
        carrier:
        - gas
        operation: scale
        value: 3
  price_gas_5:
