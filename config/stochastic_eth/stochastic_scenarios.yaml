# Minimal stochastic scenario definition for PyPSA (v1.x) set_scenarios()

scenarios:
  s1: 0.1
  s2: 0.2
  s3: 0.05
  s4: 0.05
  s5: 0.1
  s6: 0.07
  s7: 0.08
  s8: 0.1
  s9: 0.25

patches:
  - target: "loads_t.p_set"
    op: "scale"
    selector:
      names: ".*"      # regex: all loads
    values:
      s1: 0.2
      s2: 0.4
      s3: 0.6
      s4: 0.8
      s5: 1.0
      s6: 1.2
      s7: 1.4
      s8: 1.6
      s9: 1.8

