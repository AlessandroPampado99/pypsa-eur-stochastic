# Simplified demand-transition scenario catalogue for stochastic in-sample runs.
# Enable with:
#   stochastic_scenarios:
#     enable: true
#     file: config/demand_uncertainty/scenarios/scenarios_stochastic.yaml
#
# The probabilities below define the in-sample stochastic cases. The same
# scenario_definitions block can also be reused for deterministic validation.

scenarios:
  BASE: 0.20
  ELEC_HEAT: 0.20
  OILGAS_ROAD: 0.20
  MEOH_AIR: 0.20
  H2_IND: 0.20

settings:
  units: TWh
  weighting: generators
  allow_unmet_target: false
  tolerance_twh: 1.0e-4
  non_negative_tolerance: 1.0e-8

families:
  ELEC:
    # Targets are target/output demand additions in TWh/a. For heat, this is
    # additional electricity demand after COP conversion, not heat removed.
    targets:
      conservative: 400
      high: 600
    entries:
      building_heat:
        source:
          - rural heat
          - urban central heat
          - urban decentral heat
        target: electricity
        cap: 0.20
        type: shift
        cop:
          rural heat: rural air heat pump
          urban central heat: urban central air heat pump
          urban decentral heat: urban decentral air heat pump

      agriculture_heat:
        source: agriculture heat
        target: agriculture electricity
        cap: 0.20
        type: shift
        cop:
          agriculture heat: rural air heat pump

      land_transport_oil:
        source: land transport oil
        target: land transport EV
        cap: 0.20
        type: shift
        efficiency_factor: 0.302145139124

      agriculture_machinery_oil:
        source: agriculture machinery oil
        target: agriculture machinery electric
        cap: 0.20
        type: shift
        efficiency_factor: 2.333333333333

      solid_biomass_for_industry:
        source: solid biomass for industry
        target: electricity
        cap: 0.20
        type: shift
        efficiency_factor: 1.0

      low_temperature_heat_for_industry:
        source: low-temperature heat for industry
        target: electricity
        cap: 0.20
        type: shift
        cop:
          low-temperature heat for industry: urban central air heat pump

  OILGAS:
    # Delayed-transition cases are written as ordinary shifts from the existing
    # low-carbon demand back to fossil demand. The source reduction is capped and
    # cannot become negative, so no reverse_shift-specific controls are needed.
    targets:
      conservative: 100
      high: 150
    entries:
      land_transport_oil:
        source: land transport EV
        target: land transport oil
        cap: 0.95
        type: shift
        efficiency_factor: 3.309644857175

      gas_for_industry:
        source: H2 for industry
        target: gas for industry
        cap: 0.95
        type: shift
        efficiency_factor: 1.0

      shipping_oil:
        source:
          carrier: shipping methanol
        target: shipping oil
        cap: 0.95
        type: shift
        efficiency_factor: 1.15

      agriculture_machinery_oil:
        source: agriculture machinery electric
        target: agriculture machinery oil
        cap: 0.95
        type: shift
        efficiency_factor: 0.428571428571

  MEOH:
    # Renewable/synthetic liquid-fuel demand shifts. Target loads must already
    # exist and have a positive profile; zero target loads are left unchanged.
    targets:
      conservative: 250
      high: 275
    entries:
      aviation_kerosene:
        source: kerosene for aviation
        target: methanol kerosene for aviation
        cap: 0.35
        type: shift
        efficiency_factor: 1.0

      naphtha_for_industry:
        source: naphtha for industry
        target: industry methanol
        cap: 0.35
        type: shift
        efficiency_factor: 1.0

      solid_biomass_for_industry:
        source: solid biomass for industry
        target: industry methanol
        cap: 0.20
        type: shift
        efficiency_factor: 1.0

      shipping_oil_to_methanol:
        source: shipping oil
        target:
          carrier: shipping methanol
        cap: 1.00
        type: shift
        efficiency_factor: 0.869565217391

      shipping_h2_to_methanol:
        source: H2 for shipping
        target:
          carrier: shipping methanol
        cap: 1.00
        type: shift
        efficiency_factor: 1.0

  H2:
    # Direct hydrogen scenarios are also expressed as shifts from existing
    # fossil/biomass demand into existing H2/NH3/fuel-cell demand loads.
    targets:
      conservative: 50
      high: 80
    entries:
      h2_for_industry:
        source:
          - gas for industry
          - solid biomass for industry
        target: H2 for industry
        cap: 0.20
        type: shift
        efficiency_factor: 1.0

      nh3:
        source: naphtha for industry
        target:
          name: EU NH3
        cap: 0.20
        type: shift
        efficiency_factor: 1.0

      h2_shipping:
        source: shipping oil
        target: H2 for shipping
        cap: 0.40
        type: shift
        efficiency_factor: 1.0

      land_transport_fuel_cell:
        source: land transport oil
        target: land transport fuel cell
        cap: 0.20
        type: shift
        efficiency_factor: 0.535651226544

scenario_definitions:
  BASE: base

  ELEC_HEAT:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - building_heat

  ELEC_ROAD:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - land_transport_oil
        - agriculture_machinery_oil
        - building_heat

  ELEC_IND:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - low_temperature_heat_for_industry
        - solid_biomass_for_industry
        - building_heat

  OILGAS_ROAD:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - land_transport_oil

  OILGAS_IND:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - gas_for_industry
        - land_transport_oil

  OILGAS_SHIP:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - shipping_oil
        - land_transport_oil

  MEOH_AIR:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - aviation_kerosene
        - naphtha_for_industry
        - shipping_oil_to_methanol

  MEOH_HVC:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - naphtha_for_industry
        - solid_biomass_for_industry
        - aviation_kerosene

  MEOH_SHIP:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - shipping_oil_to_methanol
        - shipping_h2_to_methanol
        - aviation_kerosene

  H2_IND:
    demand_transition:
      family: H2
      target: conservative
      priority:
        - h2_for_industry
        - nh3

  H2_NH3:
    demand_transition:
      family: H2
      target: conservative
      priority:
        - nh3
        - h2_for_industry

  H2_TRANS:
    demand_transition:
      family: H2
      target: conservative
      priority:
        - land_transport_fuel_cell
        - h2_shipping
        - h2_for_industry
        - nh3

  ELEC_HIGH:
    demand_transition:
      family: ELEC
      target: high
      priority:
        - building_heat
        - land_transport_oil

  OILGAS_HIGH:
    demand_transition:
      family: OILGAS
      target: high
      priority:
        - land_transport_oil
        - gas_for_industry

  MEOH_HIGH:
    demand_transition:
      family: MEOH
      target: high
      priority:
        - aviation_kerosene
        - naphtha_for_industry
        - shipping_oil_to_methanol

  H2_HIGH:
    demand_transition:
      family: H2
      target: high
      priority:
        - h2_for_industry
        - nh3
        - h2_shipping
        - land_transport_fuel_cell
