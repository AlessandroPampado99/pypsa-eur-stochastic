# Simplified demand-transition scenario catalogue for deterministic runs.
# Select one scenario from scenario_definitions with:
#   stochastic_scenarios:
#     enable: false
#     file: config/demand_uncertainty/scenario_deterministic.yaml
#     active_scenario: ELEC_HEAT
#
# The catalogue uses one main transition type: shift. Each entry reduces source
# demand and increases existing target demand. Missing or zero target loads are
# not created or filled by this configuration.

settings:
  units: TWh
  weighting: generators
  allow_unmet_target: false
  tolerance_twh: 1.0e-4
  non_negative_tolerance: 1.0e-8

families:
  ELEC:
    # Targets are target/output demand additions in TWh/a. For heat, this is
    # additional electricity demand after COP conversion, not heat removed.
    targets:
      conservative: 400
      high: 600

    entries:
      building_heat:
        source:
          - rural heat
          - urban central heat
          - urban decentral heat
        target: electricity
        cap: 0.20
        type: shift
        cop:
          rural heat: rural air heat pump
          urban central heat: urban central air heat pump
          urban decentral heat: urban decentral air heat pump

      agriculture_heat:
        source: agriculture heat
        target: agriculture electricity
        cap: 0.20
        type: shift
        cop:
          agriculture heat: rural air heat pump

      land_transport_oil:
        source: land transport oil
        target: land transport EV
        cap: 0.20
        type: shift
        efficiency_factor: 0.302145139124

      agriculture_machinery_oil:
        source: agriculture machinery oil
        target: agriculture machinery electric
        cap: 0.20
        type: shift
        efficiency_factor: 2.333333333333

      solid_biomass_for_industry:
        source: solid biomass for industry
        target: industry electricity
        cap: 0.20
        type: shift
        efficiency_factor: 1.0

      low_temperature_heat_for_industry:
        source: low-temperature heat for industry
        target: industry electricity
        cap: 0.20
        type: shift
        cop:
          low-temperature heat for industry: urban central air heat pump

  OILGAS:
    # Delayed-transition cases are written as ordinary shifts from the existing
    # low-carbon demand back to fossil demand. The source reduction is capped and
    # cannot become negative, so no reverse_shift-specific controls are needed.
    targets:
      conservative: 100
      high: 150

    entries:
      land_transport_EV:
        source: land transport EV
        target: land transport oil
        cap: 0.2
        type: shift
        efficiency_factor: 3.309644857175

      industry_electricity:
        source: industry electricity
        target: gas for industry
        cap: 0.2
        type: shift
        cop_mode: inverse
        cop:
          industry electricity: urban central air heat pump

      low_temperature_heat_for_industry:
        source: low-temperature heat for industry
        target: gas for industry
        cap: 0.2
        type: shift
        efficiency_factor: 1.0

      shipping_methanol:
        source:
          carrier: shipping methanol
        target: shipping oil
        cap: 0.2
        type: shift
        efficiency_factor: 1.15

      agriculture_machinery_electric:
        source: agriculture machinery electric
        target: agriculture machinery oil
        cap: 0.2
        type: shift
        efficiency_factor: 0.428571428571

  MEOH:
    # Renewable/synthetic liquid-fuel demand shifts. Target loads must already
    # exist and have a positive profile; zero target loads are left unchanged.
    targets:
      conservative: 250
      high: 275

    entries:
      aviation_kerosene:
        source: kerosene for aviation
        target: methanol kerosene for aviation
        cap: 0.2
        type: shift
        efficiency_factor: 1.0

      low_temperature_heat_for_industry:
        source: low-temperature heat for industry
        target: industry methanol
        cap: 0.2
        type: shift
        efficiency_factor: 1.0

      industry_electricity:
        source: industry electricity
        target: industry methanol
        cap: 0.20
        type: shift
        cop_mode: inverse
        cop:
          industry electricity: urban central air heat pump

      shipping_oil:
        source: shipping oil
        target:
          carrier: shipping methanol
        cap: 0.2
        type: shift
        efficiency_factor: 0.869565217391

      shipping_h2:
        source: H2 for shipping
        target:
          carrier: shipping methanol
        cap: 1.00
        type: shift
        efficiency_factor: 1.0

  H2:
    # Direct hydrogen scenarios are also expressed as shifts from existing
    # fossil/biomass demand into existing H2/NH3/fuel-cell demand loads.
    targets:
      conservative: 50
      high: 80

    entries:
      low-temperature heat for industry:
        source:
          - low-temperature heat for industry
        target: H2 for industry
        cap: 0.20
        type: shift
        efficiency_factor: 1.0

      industry electricity:
        source:
          - industry electricity
        target: H2 for industry
        cap: 0.20
        type: shift
        cop_mode: inverse
        cop:
          industry electricity: urban central air heat pump

      shipping_oil:
        source: shipping oil
        target: H2 for shipping
        cap: 0.40
        type: shift
        efficiency_factor: 1.0

      land_transport_oil:
        source: land transport oil
        target: land transport fuel cell
        cap: 0.20
        type: shift
        efficiency_factor: 0.535651226544

scenario_definitions:
  BASE: base

  ELEC_HEAT:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - building_heat
        - agriculture_heat
        - low_temperature_heat_for_industry

  ELEC_ROAD:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - land_transport_oil
        - agriculture_machinery_oil
        - building_heat

  ELEC_IND:
    demand_transition:
      family: ELEC
      target: conservative
      priority:
        - low_temperature_heat_for_industry
        - solid_biomass_for_industry
        - building_heat

  OILGAS_ROAD:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - land_transport_EV
        - agriculture_machinery_electric

  OILGAS_IND:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - industry_electricity
        - low_temperature_heat_for_industry
        - land_transport_EV

  OILGAS_SHIP:
    demand_transition:
      family: OILGAS
      target: conservative
      priority:
        - shipping_methanol
        - land_transport_EV
        - agriculture_machinery_electric

  MEOH_AIR:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - aviation_kerosene
        - shipping_oil
        - industry_electricity
        - low_temperature_heat_for_industry

  MEOH_IND:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - industry_electricity
        - low_temperature_heat_for_industry
        - aviation_kerosene
        - shipping_oil


  MEOH_SHIP:
    demand_transition:
      family: MEOH
      target: conservative
      priority:
        - shipping_oil
        - shipping_h2
        - industry_electricity
        - low_temperature_heat_for_industry
        - aviation_kerosene

  H2_IND:
    demand_transition:
      family: H2
      target: conservative
      priority:
        - industry electricity
        - low-temperature heat for industry

  H2_TRANS:
    demand_transition:
      family: H2
      target: conservative
      priority:
        - land_transport_oil
        - shipping_oil
        - industry electricity
        - low-temperature heat for industry

  ELEC_HIGH:
    demand_transition:
      family: ELEC
      target: high
      priority:
        - building_heat
        - land_transport_oil
        - low_temperature_heat_for_industry

  OILGAS_HIGH:
    demand_transition:
      family: OILGAS
      target: high
      priority:
        - land_transport_ev
        - industry_electricity
        - low_temperature_heat_for_industry

  MEOH_HIGH:
    demand_transition:
      family: MEOH
      target: high
      priority:
        - aviation_kerosene
        - shipping_oil
        - industry_electricity
        - low_temperature_heat_for_industry

  H2_HIGH:
    demand_transition:
      family: H2
      target: high
      priority:
        - industry_electricity
        - low_temperature_heat_for_industry
        - shipping_oil
        - land_transport_oil
