input_dir: "results/demand_uncertainty_sensitivity"
output_dir: "results/demand_uncertainty_sensitivity/analysis_output/ELEC_HEAT"
network_file: "base_s_adm___2035.nc"
base_network_path: "results/demand_uncertainty_sensitivity/BASE/networks/base_s_adm___2035.nc"
included_scenarios: [BASE_CO2, ELEC_HEAT_200, ELEC_HEAT_300, ELEC_HEAT_400, ELEC_HEAT_500, ELEC_HEAT_600]
model_config: "config/demand_uncertainty/config_deterministic.yaml"
plotting_config: "config/plotting.default.yaml"
parameters: {scenario_name_mode: folder, save_png: true, save_pdf: false, dpi: 300, zero_tol: 1.0e-9}

scripts:
  plot_scenario_energy_balance:
    overrides:
      SCENARIO_ORDER: [__BASE__, BASE_CO2, ELEC_HEAT_200, ELEC_HEAT_300, ELEC_HEAT_400, ELEC_HEAT_500, ELEC_HEAT_600]
      SCENARIO_PREFIX_ALIASES: {__BASE__: BASE, ELEC_HEAT: E_HEAT}
      SEGMENT_LABEL_MIN_PERCENT: 3.0
      LEGEND_MIN_PERCENT: 0.5
      FAMILY_GROUPS:
        BASE:
          - __BASE__
          - BASE_CO2
        E_HEAT:
          - ELEC_HEAT_200
          - ELEC_HEAT_300
          - ELEC_HEAT_400
          - ELEC_HEAT_500
          - ELEC_HEAT_600
      FAMILY_ORDER: [BASE, E_HEAT]
  plot_scenario_optimal_capacity:
    overrides:
      SCENARIO_ORDER: [__BASE__, BASE_CO2, ELEC_HEAT_200, ELEC_HEAT_300, ELEC_HEAT_400, ELEC_HEAT_500, ELEC_HEAT_600]
      SCENARIO_PREFIX_ALIASES: {__BASE__: BASE, ELEC_HEAT: E_HEAT}
      SEGMENT_LABEL_MIN_PERCENT: 3.0
      LEGEND_MIN_PERCENT: 0.5
      FAMILY_GROUPS:
        BASE:
          - __BASE__
          - BASE_CO2
        E_HEAT:
          - ELEC_HEAT_200
          - ELEC_HEAT_300
          - ELEC_HEAT_400
          - ELEC_HEAT_500
          - ELEC_HEAT_600
      FAMILY_ORDER: [BASE, E_HEAT]
